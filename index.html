<style>
  :root{
    --w:min(100vw,480px);
    --purple:#634093;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:#F8F0ED;-webkit-text-size-adjust:100%;font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
  .page{width:var(--w);margin:0 auto;background:#fff;overflow:hidden;position:relative;box-shadow:0 0 40px rgba(99,64,147,.08)}
  img{display:block;max-width:100%}
  .abs{position:absolute}
  .sec{position:relative}
  .sec>img.bg{width:100%;height:auto}

  /* ---------- 첫 화면 ---------- */
  .hero{position:relative;width:100%;padding-top:141.3889%; /* 1527/1080 */ background:#fff;overflow:hidden}
  .hero .abs{will-change:transform,opacity}
  .fl{opacity:0}
  .fl-tl{left:0;top:0;width:42.1296%;transform-origin:0 0;animation:bloomTL 1.8s cubic-bezier(.2,.8,.2,1) .1s forwards, swayTL 7s ease-in-out 1.9s infinite alternate}
  .fl-br{right:0;top:63.6542%;width:42.1296%;transform-origin:100% 100%;animation:bloomBR 1.8s cubic-bezier(.2,.8,.2,1) .4s forwards, swayBR 8s ease-in-out 2.2s infinite alternate}
  @keyframes bloomTL{from{opacity:0;transform:scale(.82) rotate(-5deg)}to{opacity:1;transform:scale(1) rotate(0)}}
  @keyframes bloomBR{from{opacity:0;transform:scale(.82) rotate(5deg)}to{opacity:1;transform:scale(1) rotate(0)}}
  @keyframes swayTL{from{transform:rotate(0)}to{transform:rotate(1.6deg)}}
  @keyframes swayBR{from{transform:rotate(0)}to{transform:rotate(-1.8deg)}}

  .t{opacity:0}
  .t-icon{animation:rise 1.2s ease .9s forwards}
  .t-sub{animation:rise 1.2s ease 1.3s forwards}
  .t-title{opacity:1;-webkit-clip-path:inset(0 100% 0 0);clip-path:inset(0 100% 0 0);animation:write 1.8s ease-in-out 1.8s forwards}
  .t-invite{animation:soft 1.8s ease 3.4s forwards}
  .t-divider{transform:scaleX(0);opacity:1;animation:line 1s ease 4.6s forwards}
  .t-date{animation:rise 1.2s ease 5s forwards}
  .t-logo{animation:rise 1.2s ease 5.4s forwards}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @keyframes write{to{-webkit-clip-path:inset(0 0 0 0);clip-path:inset(0 0 0 0)}}
  @keyframes soft{from{opacity:0;transform:scale(.94);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
  @keyframes line{to{transform:scaleX(1)}}

  /* 꽃잎 */
  .petal{position:absolute;top:-6%;width:3.2%;padding-top:2.4%;border-radius:80% 0 80% 0;
    background:linear-gradient(135deg,#FBD3CF,#F2A9A1);opacity:0;pointer-events:none;
    animation:fall linear infinite}
  @keyframes fall{
    0%{opacity:0;transform:translate(0,0) rotate(0)}
    10%{opacity:.85}
    50%{transform:translate(6vw,55vh) rotate(160deg)}
    90%{opacity:.7}
    100%{opacity:0;transform:translate(-4vw,110vh) rotate(320deg)}
  }

  /* 스크롤 안내 */
  .hint{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:20;opacity:0;transition:opacity .6s;pointer-events:none;text-align:center}
  .hint.show{opacity:1}
  .hint svg{width:34px;height:34px;animation:bob 1.6s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(8px)}}

  /* 아래 내용이 서서히 나타나게 */
  .reveal{opacity:0;transform:translateY(28px);transition:opacity 1s ease,transform 1s ease}
  .reveal.in{opacity:1;transform:none}

  /* 임직자 사진 자리 */
  .photo{position:absolute;overflow:hidden;background:#fff}
  .photo img{width:100%;height:100%;object-fit:cover}

  /* 디데이 */
  .dday{position:absolute;left:30%;width:40%;top:89.6%;height:6.2%;background:#F9F3F0;
    display:flex;align-items:center;justify-content:center;
    font-family:"TlabR",serif;color:var(--purple);font-size:calc(var(--w)*0.0494);line-height:1}
  @font-face{font-family:"TlabR";src:url(font/tlab-r.ttf) format("truetype");font-display:swap}

  /* 지도 */
  .mapwrap{padding:0 8.333%;background:#fff}
  .map{position:relative;display:block;border-radius:8px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.08)}
  .map img{width:100%;height:auto}
  .open{margin:4% auto 0;background:#03C75A;color:#fff;text-decoration:none;
    font-weight:700;font-size:calc(var(--w)*0.04);padding:.7em 1.4em;border-radius:999px;box-shadow:0 2px 8px rgba(0,0,0,.15);
    display:flex;align-items:center;justify-content:center;gap:.4em;width:fit-content;white-space:nowrap}
  .open svg{width:1.1em;height:1.1em}
  .map .credit{position:absolute;left:2%;bottom:2%;font-size:10px;color:#666;background:rgba(255,255,255,.75);padding:1px 4px;border-radius:3px}
  /* 공유 버튼 */
  .btn{position:absolute;display:block;background:transparent;border:0;padding:0;cursor:pointer;border-radius:14px;
    -webkit-tap-highlight-color:rgba(99,64,147,.12)}
  .btn:focus-visible{outline:3px solid var(--purple);outline-offset:2px}
  .btn-kakao{left:12%;width:26%;top:77.2%;height:14.8%}
  .btn-url{left:58%;width:26%;top:77.2%;height:14.8%}

  .toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:rgba(40,30,55,.92);color:#fff;
    padding:14px 22px;border-radius:999px;font-size:16px;opacity:0;transition:.35s;z-index:30;white-space:nowrap;pointer-events:none}
  .toast.show{opacity:1;transform:translate(-50%,0)}

  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  @media (prefers-reduced-motion:reduce){
    .fl,.t,.t-title,.t-divider{animation:none!important;opacity:1!important;transform:none!important;-webkit-clip-path:none!important;clip-path:none!important}
    .petal{display:none}
    .reveal{opacity:1;transform:none;transition:none}
  }
</style>
<script>
/* 카카오톡 안에서 열리면 휴대폰 기본 브라우저로 넘기기 */
(function(){
  var ua=navigator.userAgent||'';
  if(/KAKAOTALK/i.test(ua)){
    location.href='kakaotalk://web/openExternal?url='+encodeURIComponent(location.href);

</head>
<body>

    <img class="abs fl fl-tl" src="img/fl_tl.png" alt="">

    <img class="abs t t-logo"    src="img/h_logo.png"    alt="예수교대한성결교회 지성교회" style="left:27.685%;top:79.044%;width:44.907%">

    <!-- 사진 자리 (사진이 생기면 img 폴더에 p1~p4.jpg로 넣고 아래 주석을 풀면 됩니다) -->

    <div class="photo" style="left:55.741%;top:59.624%;width:25.185%;height:25.728%"><img src="img/p4.jpg" alt="이재훈"></div>
    -->
  </section>

  <!-- 4. 달력 · 디데이 -->
  <section class="sec reveal" id="calendar">
    <img class="bg" src="img/s3.webp" loading="lazy" decoding="async" alt="임직감사예배일 2026년 12월 13일 주일 오후 3시">

  <!-- 5. 장소 · 오시는 길 · 공유 -->
  <section class="reveal" id="place">
    <img class="bg" src="img/s4a.webp" loading="lazy" decoding="async" style="width:100%;height:auto"
      alt="장소 경기도 부천시 원미구 부천로122번길 49 지성교회 예배당">
    <div class="mapwrap">
      <a class="map" id="mapLink" href="#" target="_blank" rel="noopener" aria-label="네이버 지도에서 지성교회 위치 열기">
        <img src="img/map.webp" loading="lazy" decoding="async" alt="지성교회 주변 지도. 원미구청, 부천북초등학교, 원미종합시장 근처">

      <a class="open" id="mapBtn" href="#" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" aria-hidden="true"><path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>
        네이버 지도로 길찾기
      </a>
    </div>
    <div class="sec">
      <img class="bg" src="img/s4b.webp" loading="lazy" decoding="async"
        alt="오시는 길. 지하철 1호선 부천역 1, 3번 출구에서 원미구청 방면으로 약 20분 도보, 7호선 춘의역 2번 출구에서 원미구청 방면으로 약 15분 도보. 버스 원미동우체국(마을) 또는 부천북초등학교.원미동우체국 정류장 이용. 자가용 원미구청 주차장 이용(주말 무료), 도보 3분">
      <button class="btn btn-kakao" id="btnKakao" type="button" aria-label="카카오톡으로 초대장 공유하기"></button>
      <button class="btn btn-url" id="btnUrl" type="button" aria-label="초대장 주소 복사하기"></button>

<div class="hint" id="hint" aria-hidden="true">
  <svg viewBox="0 0 24 24" fill="none" stroke="#634093" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
/* ===== 여기만 고치면 돼요 ===== */
var CONFIG = {
  // 예배 날짜와 시간 (한국 시간)
  eventDate: "2026-12-13T15:00:00+09:00",
  // 네이버 지도 링크 (지성교회 위치)
  naverMap: "https://naver.me/FW0PJUwl",
  // 카카오 JavaScript 키 (받으면 넣으세요. 비워 두면 휴대폰 공유창으로 공유돼요)
  kakaoKey: "7c9b0922c649a9059f828591afa7f09c",
  // 카카오톡 카드에 들어갈 내용
  shareTitle: "지성교회 안수집사 임직감사예배",
  shareText: "2026. 12. 13 (주일) 오후 3시 · 지성교회 예배당",
  shareImage: "img/og.jpg"
};
/* ============================== */

(function(){
  // 네이버 지도
  document.getElementById('mapLink').href = CONFIG.naverMap;
  document.getElementById('mapBtn').href = CONFIG.naverMap;

  // 디데이 (한국 날짜 기준)
  function kstDay(d){ var k=new Date(d.getTime()+9*3600*1000); return Date.UTC(k.getUTCFullYear(),k.getUTCMonth(),k.getUTCDate()); }
  function updateDday(){
    var diff=Math.round((kstDay(new Date(CONFIG.eventDate))-kstDay(new Date()))/86400000);
    var el=document.getElementById('dday');
    el.textContent = diff>0 ? 'D-'+diff : (diff===0 ? '예배 당일' : '감사합니다');
  }
  updateDday(); setInterval(updateDday, 60*60*1000);

  // 아래 내용이 서서히 나타나게
  var items=document.querySelectorAll('.reveal');
  if('IntersectionObserver' in window){
    var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}})},{threshold:.15});
    items.forEach(function(el){io.observe(el)});
  } else { items.forEach(function(el){el.classList.add('in')}); }

  // 스크롤 안내 화살표
  var hint=document.getElementById('hint');
  setTimeout(function(){ if(window.scrollY<40) hint.classList.add('show'); }, 6200);
  window.addEventListener('scroll',function(){ if(window.scrollY>40) hint.classList.remove('show'); },{passive:true});

  // 알림
  var toast=document.getElementById('toast'), tt;
  function say(msg){ toast.textContent=msg; toast.classList.add('show'); clearTimeout(tt); tt=setTimeout(function(){toast.classList.remove('show')},2600); }

  // 주소 복사
  function pageUrl(){ return location.href.split('#')[0]; }
  function copy(text, done){
    function fallback(){
      var ta=document.createElement('textarea'); ta.value=text; ta.setAttribute('readonly','');
      ta.style.position='fixed'; ta.style.top='-1000px'; document.body.appendChild(ta); ta.select();
      var ok=false; try{ ok=document.execCommand('copy'); }catch(e){}
      document.body.removeChild(ta); done(ok);
    }
    if(navigator.clipboard && window.isSecureContext){
      navigator.clipboard.writeText(text).then(function(){done(true)}, fallback);
    } else fallback();
  }
  document.getElementById('btnUrl').addEventListener('click',function(){
    copy(pageUrl(), function(ok){ say(ok ? '초대장 주소를 복사했어요' : '주소를 길게 눌러 복사해 주세요'); });
  });

  // 카카오톡 공유
  function absUrl(p){ var a=document.createElement('a'); a.href=p; return a.href; }
  var kakaoReady=false;
  if(CONFIG.kakaoKey){
    var s=document.createElement('script');
    s.src='https://t1.kakaocdn.net/kakao_js_sdk/2.7.2/kakao.min.js'; s.async=true;
    s.onload=function(){ try{ if(!Kakao.isInitialized()) Kakao.init(CONFIG.kakaoKey); kakaoReady=true; }catch(e){} };
    document.head.appendChild(s);
  }
  document.getElementById('btnKakao').addEventListener('click',function(){
    var url=pageUrl();
    if(kakaoReady){
      try{
        Kakao.Share.sendDefault({
          objectType:'feed',
          content:{ title:CONFIG.shareTitle, description:CONFIG.shareText, imageUrl:absUrl(CONFIG.shareImage),
                    link:{ mobileWebUrl:url, webUrl:url } },
          buttons:[{ title:'초대장 보기', link:{ mobileWebUrl:url, webUrl:url } }]
        });
        return;
      }catch(e){}
    }
    if(navigator.share){
      navigator.share({ title:CONFIG.shareTitle, text:CONFIG.shareText, url:url }).catch(function(){});
      return;
    }
    copy(url, function(ok){ say(ok ? '주소를 복사했어요. 카카오톡에 붙여 넣어 주세요' : '주소를 길게 눌러 복사해 주세요'); });
  });
})();
</script>
